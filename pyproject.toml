[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-benchmark"
version = "0.1.0"
description = "TRACE evaluation of dynamic fidelity and reliability in clinical trajectory models."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "matplotlib",
  "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/Nesma876/Trace-paper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
